name: ${PROJECT_KEY:-decision-copilot}-${PROJECT_ENV:-local}-dynamodb

services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: ${PROJECT_KEY:-decision-copilot}-${PROJECT_ENV:-local}-dynamodb
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data
    ports:
      - "${DYNAMODB_PORT:-8000}:8000"
    working_dir: /home/dynamodblocal
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    # amazon/dynamodb-local:latest ships /home/dynamodblocal/data owned by
    # root, but the image default user is dynamodblocal (UID 1000) — so the
    # default user cannot write the sqlite db. Run as root to sidestep the
    # mismatch; this is a localhost-only dev container with fake creds.
    user: "0:0"

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: ${PROJECT_KEY:-decision-copilot}-${PROJECT_ENV:-local}-dynamodb-admin
    ports:
      - "${DYNAMODB_ADMIN_PORT:-8001}:8001"
    environment:
      - DYNAMO_ENDPOINT=http://dynamodb:8000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
    depends_on:
      - dynamodb

volumes:
  dynamodb-data:
    driver: local
